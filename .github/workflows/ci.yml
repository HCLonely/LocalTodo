name: Windows portable build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - name: Read version and validate release tag
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match tauri.conf.json: v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $toolchainText = Get-Content rust-toolchain.toml -Raw
          $toolchain = [regex]::Match($toolchainText, '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$toolchain) { throw 'Rust toolchain channel is missing' }
          "toolchain=$toolchain" >> $env:GITHUB_OUTPUT
          # Override the local file so CI does not request its rustfmt/clippy components.
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Restore installed npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install npm dependencies on cache miss
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Set up minimal Rust toolchain
        # Pin the same compiler as rust-toolchain.toml; no rustfmt/clippy installation.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.version.outputs.toolchain }}

      - name: Restore Rust dependencies and compiled crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: windows-x64-portable-release
          cache-workspace-crates: 'true'
          cache-bin: 'false'

      - name: Build and package portable application
        run: ./scripts/build.ps1

      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: LocalTodo-${{ steps.version.outputs.version }}-windows-x64
          path: |
            portable/LocalTodo-*-windows-x64.zip
            portable/LocalTodo-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(Get-ChildItem portable/LocalTodo-*-windows-x64.zip* -File | ForEach-Object FullName)
          gh release view $tag --json id 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            $options = @('--verify-tag', '--title', "拾序 $tag · Windows 便携版", '--generate-notes')
            if ($tag.Contains('-')) { $options += @('--prerelease', '--latest=false') }
            gh release create $tag @files @options
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
